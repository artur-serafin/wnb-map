<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 16px/1.4 system-ui, sans-serif; }
  header, .fabs, #menuLayer, .leaflet-control { touch-action: manipulation; }
  header { display: flex; align-items: center; gap: .5rem; padding: .5rem .9rem; padding-top: calc(.5rem + env(safe-area-inset-top, 0px)); background: #14213d; color: #fff; }
  header h1 { flex: 1; min-width: 0; font-size: 1rem; margin: 0; font-weight: 600; }
  .burger { flex: none; width: 40px; height: 40px; margin: -.35rem -.5rem -.35rem 0; padding: 0; display: grid; place-items: center; border: 0; background: transparent; color: #fff; }
  .burger svg, .fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  #notes { position: absolute; top: 10px; left: 0; right: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .pill { font-variant-numeric: tabular-nums; max-width: 90%; padding: .35rem .9rem; border-radius: 999px; background: rgba(20,33,61,.82); color: #fff; font-size: .9rem; text-align: center; }
  .pill[hidden], #menuLayer[hidden] { display: none; }
  .fabs { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  .fab { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 10px; background: rgba(255,255,255,.95); color: #14213d; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .gap { height: 8px; }
  .fab[hidden] { display: none; }
  #menuLayer { position: absolute; inset: 0; z-index: 1100; }
  #backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); }
  .menu { position: absolute; top: 8px; right: calc(8px + env(safe-area-inset-right, 0px)); width: min(86vw, 340px); max-height: calc(100% - 16px); overflow: auto; box-sizing: border-box; padding: .8rem 1rem 1rem; border-radius: 14px; background: #fff; color: #14213d; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  .menu h2 { margin: .3rem 0 .4rem; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: .6; }
  .menu h2:not(:first-child) { margin-top: 1rem; }
  .menu p { margin: .4rem 0; font-size: .85rem; }
  .seg { display: flex; gap: .4rem; }
  .seg button { flex: 1; padding: .5rem; border: 1px solid #14213d; border-radius: 8px; background: #fff; color: #14213d; font: inherit; }
  .seg button[aria-pressed="true"] { background: #14213d; color: #fff; }
  .leaflet-tooltip.orgtip { background: #fff; color: #14213d; border: 0; border-radius: 10px; padding: 4px 8px; font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
  .leaflet-tooltip-top.orgtip::before { border-top-color: #fff; }
  .arrow, .sficon { background: none; border: 0; }
  .beam { background: none; border: 0; transition: opacity .3s; }
  .beam svg { transition: transform .3s linear; }
  .leaflet-tooltip.sftip { background: #fff; color: #14213d; border: 0; border-radius: 8px; padding: 2px 7px; font-size: .75rem; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .leaflet-tooltip.sftip::before { display: none; }
  .far .sftip { display: none; }
  .poi { background: none; border: 0; }
  .leaflet-marker-icon.poi.leaflet-interactive { pointer-events: none; }
  .poi svg { pointer-events: none; }
  .poi svg.badge { pointer-events: auto; cursor: pointer; }
  .kmpop .leaflet-popup-content-wrapper { border-radius: 10px; color: #14213d; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kmpop .leaflet-popup-content { margin: 6px 11px; line-height: 1.35; }
  #glowLayer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 900; }
  #glow { position: absolute; left: 0; top: 0; border-radius: 50%; opacity: 0; transition: opacity .25s; will-change: transform; }
  #glowDist { position: absolute; left: 0; top: 0; padding: .15rem .6rem; border-radius: 999px; background: rgba(20,33,61,.82); color: #fff; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; transition: opacity .25s; }
  .leaflet-tooltip.etatip { background: #14213d; color: #fff; border: 0; border-radius: 10px; padding: 3px 8px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
  .leaflet-tooltip.etatip::before { display: none; }
  .kmpop .sub { font-weight: 500; font-size: .8rem; opacity: .7; }
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1>
  <button class="burger" id="btnMenu" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<div class="stage">
  <div id="map"></div>
  <div id="glowLayer"><div id="glow"></div><div id="glowDist"></div></div>
  <div id="notes"><div class="pill" id="statusBox" hidden></div><div class="pill" id="geoBox" hidden></div></div>
  <div class="fabs">
    <button class="fab" id="btnIn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="fab" id="btnOut"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <div class="gap"></div>
    <button class="fab" id="btnFit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <button class="fab" id="btnOrg"><svg viewBox="0 0 24 24"><circle id="orgIcon" cx="12" cy="12" r="6.5" stroke-width="3"/></svg></button>
    <button class="fab" id="btnMe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <div id="menuLayer" hidden>
    <div id="backdrop"></div>
    <div class="menu" id="menu" role="dialog">
      <h2 id="hLang"></h2><div class="seg" id="langSeg"></div>
      <h2 id="hPrivacy"></h2><div id="privacy"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script>
const C = CONFIG, COL = C.COLORS;
const $ = id => document.getElementById(id);
const setPill = (el, text) => { el.hidden = !text; if (text) el.textContent = text; };
let T = {}, lang = null;
const fill = s => (s || '').replace('{name}', C.ORGANIZER_NAME);

// ---------- języki ----------
function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem('wnb_lang'); } catch (e) {}
  if (saved && C.LANGS[saved]) return saved;
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  return C.LANGS[nav] ? nav : C.DEFAULT_LANG;
}
async function setLang(code, save) {
  try {
    const res = await fetch(C.LANG_DIR + code + '.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    T = await res.json(); lang = code;
  } catch (e) {
    if (code !== C.DEFAULT_LANG) return setLang(C.DEFAULT_LANG, false);
    return;
  }
  if (save) { try { localStorage.setItem('wnb_lang', code); } catch (e) {} }
  applyTexts();
}
function applyTexts() {
  document.documentElement.lang = lang;
  [['btnIn', T.BTN_ZOOM_IN], ['btnOut', T.BTN_ZOOM_OUT], ['btnFit', T.BTN_FIT],
   ['btnOrg', fill(T.BTN_ORG)], ['btnMe', T.BTN_ME], ['btnMenu', T.BTN_MENU]]
    .forEach(([id, t]) => { $(id).setAttribute('aria-label', t || ''); $(id).title = t || ''; });
  $('menu').setAttribute('aria-label', T.BTN_MENU || '');
  $('hLang').textContent = T.MENU_LANGUAGE || '';
  $('hPrivacy').textContent = T.MENU_PRIVACY || '';
  const seg = $('langSeg'); seg.textContent = '';
  Object.entries(C.LANGS).forEach(([code, label]) => {
    const b = document.createElement('button');
    b.textContent = label; b.setAttribute('aria-pressed', String(code === lang));
    b.onclick = () => setLang(code, true);
    seg.appendChild(b);
  });
  const priv = $('privacy'); priv.textContent = '';
  (T.PRIVACY || []).forEach(t => { const p = document.createElement('p'); p.textContent = fill(t); priv.appendChild(p); });
  if (routeFailed) $('title').textContent = T.ROUTE_ERROR;
  refreshSfLabels(); renderGeo(); renderLive(); renderEta();
}

// ---------- menu ----------
function toggleMenu(open) {
  $('menuLayer').hidden = !open;
  $('btnMenu').setAttribute('aria-expanded', String(open));
}
$('btnMenu').onclick = () => toggleMenu($('menuLayer').hidden);
$('backdrop').onclick = () => toggleMenu(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });

$('orgIcon').style.fill = COL.organizer; $('orgIcon').style.stroke = COL.outline;

// ---------- mapa ----------
const map = L.map('map', { zoomControl: false }).setView([52.23, 21.01], 12);
const mapEl = map.getContainer();
let lastMapTap = null, pendingMapTap = null, mapZoomGesture = null;
function mapTouchPoint(e) {
  const r = mapEl.getBoundingClientRect();
  return L.point(e.clientX - r.left, e.clientY - r.top);
}
function stopMapTouch(e) { e.preventDefault(); e.stopPropagation(); }
window.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || !mapEl.contains(e.target)) return;
  const point = mapTouchPoint(e), now = Date.now();
  if (pendingMapTap) { pendingMapTap = null; lastMapTap = null; return; }
  if (lastMapTap && now - lastMapTap.time <= 400 && point.distanceTo(lastMapTap.point) <= 32) {
    stopMapTouch(e);
    mapZoomGesture = { pointerId: e.pointerId, point, startY: e.clientY, startZoom: map.getZoom(), lastZoom: map.getZoom() };
    lastMapTap = null;
  } else {
    pendingMapTap = { pointerId: e.pointerId, point, clientX: e.clientX, clientY: e.clientY, moved: false };
    lastMapTap = null;
  }
}, true);
window.addEventListener('pointermove', e => {
  if (mapZoomGesture && e.pointerId === mapZoomGesture.pointerId) {
    stopMapTouch(e);
    const zoom = mapZoomGesture.startZoom + Math.round((mapZoomGesture.startY - e.clientY) / 100);
    if (zoom !== mapZoomGesture.lastZoom) {
      map.setZoomAround(mapZoomGesture.point, zoom, { animate: false });
      mapZoomGesture.lastZoom = zoom;
    }
  } else if (pendingMapTap && e.pointerId === pendingMapTap.pointerId &&
             Math.hypot(e.clientX - pendingMapTap.clientX, e.clientY - pendingMapTap.clientY) > 12) {
    pendingMapTap.moved = true;
    lastMapTap = null;
  }
}, true);
window.addEventListener('pointerup', e => {
  if (mapZoomGesture && e.pointerId === mapZoomGesture.pointerId) {
    stopMapTouch(e);
    if (mapZoomGesture.lastZoom === mapZoomGesture.startZoom) {
      map.setZoomAround(mapZoomGesture.point, mapZoomGesture.startZoom + 1, { animate: false });
    }
    mapZoomGesture = null;
  } else if (pendingMapTap && e.pointerId === pendingMapTap.pointerId) {
    if (!pendingMapTap.moved) lastMapTap = { point: pendingMapTap.point, time: Date.now() };
    pendingMapTap = null;
  }
}, true);
window.addEventListener('pointercancel', e => {
  if (mapZoomGesture && e.pointerId === mapZoomGesture.pointerId) mapZoomGesture = null;
  if (pendingMapTap && e.pointerId === pendingMapTap.pointerId) pendingMapTap = null;
  lastMapTap = null;
}, true);
map.attributionControl.setPosition('bottomleft');
map.createPane('routePane').style.zIndex = 390;   // trasa pod ogonem i znacznikami WnB
map.createPane('arrowPane').style.zIndex = 395;   // strzałki kierunku nad trasą
map.createPane('beamPane').style.zIndex = 399;    // wskaźnik kierunku ruchu Uczestnika pod jego kropką
L.tileLayer(C.TILE_URL, { maxZoom: C.MAX_ZOOM, attribution: C.TILE_ATTRIBUTION }).addTo(map);
let routeBounds = null, routeFailed = false, routePts = [], routeCum = [], startMarker = null, finishMarker = null;
const focus = ll => map.setView(ll, Math.max(map.getZoom(), C.FOCUS_ZOOM));

function km(a, b) {
  const R = 6371, rad = Math.PI / 180, dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function formIdx(n) {
  if (lang === 'pl') { const m10 = n % 10, m100 = n % 100; return n === 1 ? 0 : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? 1 : 2; }
  return n === 1 ? 0 : 2;
}
function fmtAgo(s) {
  const sec = s < 90, n = Math.max(1, Math.round(sec ? s : s / 60)), units = (sec ? T.UNIT_SEC : T.UNIT_MIN) || ['', '', ''];
  return (T.AGO || '{ago}').replace('{ago}', n + ' ' + units[formIdx(n)]);
}

// ---------- trasa ----------
function noRoute() {   // przejazd bez trasy: pokazujemy tylko mapę i pozycję WnB
  routeFailed = false;
  const t = C.NO_ROUTE_TITLE || '';
  $('title').textContent = t;
  if (t) document.title = t;
  $('btnFit').hidden = true;   // przycisk "Cała trasa" nie ma wtedy sensu
}
async function loadRoute() {
  try {
    const res = await fetch(C.GPX_URL, { cache: 'no-cache' });
    if (res.status === 404) { noRoute(); return; }   // brak trasy to stan celowy: bez komunikatu, bez POI i ETA
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
    const trk = xml.getElementsByTagName('trk')[0];
    if (xml.getElementsByTagName('parsererror').length || !trk) throw new Error('GPX');
    const nameEl = trk.getElementsByTagName('name')[0];
    const name = (nameEl && nameEl.textContent.trim()) || C.GPX_URL.split('/').pop();
    const pts = [];
    for (const p of trk.getElementsByTagName('trkpt')) {
      const ll = [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))], last = pts[pts.length - 1];
      if (!last || last[0] !== ll[0] || last[1] !== ll[1]) pts.push(ll);
    }
    if (pts.length < 2) throw new Error('GPX');
    routeCum = [0];   // kilometraż: długość trasy od startu w kolejnych punktach (km)
    for (let i = 1; i < pts.length; i++) routeCum.push(routeCum[i - 1] + km(pts[i - 1], pts[i]));
    const total = routeCum[routeCum.length - 1];
    routePts = pts;
    const line = L.polyline(pts, { color: COL.route, weight: C.ROUTE_WIDTH, opacity: .9, pane: 'routePane' }).addTo(map);
    addStartFinish(pts);
    routeBounds = line.getBounds();
    map.fitBounds(routeBounds, { padding: [C.FIT_PADDING, C.FIT_PADDING] });
    prepRoute(); drawArrows(); updateFar(); loadPoi(); updateProgress(); renderEta();
    $('title').textContent = name + ' - ' + total.toFixed(1).replace('.', ',') + ' km';
    document.title = name;
  } catch (e) {
    routeFailed = true; $('title').textContent = T.ROUTE_ERROR || '';
  }
}

// ---------- strzałki kierunku, start i meta ----------
const AR = { on: C.SHOW_ARROWS !== false, step: C.ARROW_SPACING_PX || 110, size: C.ARROW_SIZE_PX || 14, color: COL.arrow || '#8f1d2c' };
const arrowLayer = L.layerGroup().addTo(map);

// Punkty co 'step' pikseli wzdłuż linii (px = [{x,y}]), z kierunkiem w stopniach od północy.
function arrowSpots(px, step) {
  const out = []; let toNext = step / 2;
  for (let i = 1; i < px.length; i++) {
    const a = px[i - 1], b = px[i], dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (!len) continue;
    const deg = Math.atan2(dx, -dy) * 180 / Math.PI;
    let pos = toNext;
    while (pos <= len) { out.push({ x: a.x + dx * pos / len, y: a.y + dy * pos / len, deg }); pos += step; }
    toNext = pos - len;
  }
  return out;
}
function arrowIcon(deg) {
  const s = AR.size;
  return L.divIcon({
    className: 'arrow', iconSize: [s, s], iconAnchor: [s / 2, s / 2],
    html: '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" style="transform:rotate(' + deg.toFixed(1) + 'deg)">' +
          '<path d="M12 3 20 20 12 15.5 4 20Z" fill="' + AR.color + '" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>'
  });
}
function drawArrows() {   // rysujemy tylko strzałki w okolicy widocznego fragmentu mapy
  arrowLayer.clearLayers();
  if (!AR.on || routePts.length < 2) return;
  const z = map.getZoom(), view = map.getBounds().pad(0.5);
  const px = routePts.map(ll => map.project(ll, z));
  arrowSpots(px, AR.step).forEach(s => {
    const ll = map.unproject(L.point(s.x, s.y), z);
    if (view.contains(ll)) arrowLayer.addLayer(L.marker(ll, { icon: arrowIcon(s.deg), interactive: false, keyboard: false, pane: 'arrowPane' }));
  });
}
map.on('moveend', drawArrows);

function sfIcon(kind) {
  const svg = kind === 'start'
    ? '<svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="10" fill="' + COL.start + '" stroke="#fff" stroke-width="2"/><path d="M10 7.5v9l7-4.5z" fill="#fff"/></svg>'
    : '<svg viewBox="0 0 24 24" width="26" height="26"><rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="#fff" stroke="' + COL.outline + '" stroke-width="2"/><path d="M4 4h8v8H4zM12 12h8v8h-8z" fill="' + COL.outline + '"/></svg>';
  return L.divIcon({ className: 'sficon', iconSize: [26, 26], iconAnchor: [13, 13], html: svg });
}
function addStartFinish(pts) {
  const west = pts[0][1] <= pts[pts.length - 1][1];   // etykiety po przeciwnych stronach, bo start i meta są blisko siebie
  const mk = (ll, kind, left) => L.marker(ll, { icon: sfIcon(kind), zIndexOffset: 1000, interactive: false, keyboard: false })
    .addTo(map).bindTooltip('', { permanent: true, direction: left ? 'left' : 'right', offset: [left ? -10 : 10, 0], className: 'sftip' });
  startMarker = mk(pts[0], 'start', west);
  finishMarker = mk(pts[pts.length - 1], 'finish', !west);
  refreshSfLabels();
}
function refreshSfLabels() {
  if (startMarker) startMarker.setTooltipContent(T.START || 'Start');
  if (finishMarker) finishMarker.setTooltipContent(T.FINISH || (lang === 'pl' ? 'Meta' : 'Finish'));
}
const LABELS_MIN_ZOOM = C.LABELS_MIN_ZOOM || 16;   // etykiety "Start"/"Meta" od tego przybliżenia
function updateFar() { map.getContainer().classList.toggle('far', map.getZoom() < LABELS_MIN_ZOOM); }
map.on('zoomend', updateFar);

// ---------- kilometraż trasy (dotknięcie trasy) ----------
function fmtKm(v) {
  const m = Math.round(v * 1000), k = Math.floor(m / 1000), r = m % 1000;
  return k > 0 ? k + ' km ' + r + ' m' : r + ' m';
}
// Kilometry trasy w pobliżu punktu (zwykle jeden; w miejscach, gdzie trasa przecina samą siebie, kilka).
function routeKmAt(latlng) {
  const z = map.getZoom(), p = map.project(latlng, z), hit = C.ROUTE_TAP_PX || 22;
  // Przy małym przybliżeniu promień dotknięcia obejmuje setki metrów, więc kolejne odcinki tego samego fragmentu
  // trasy (zakręty, zygzaki) nie mogą być liczone jako różne miejsca: łączymy je, jeśli leżą bliżej niż ok. 4 promienie.
  const mpp = 156543.03 * Math.cos(latlng.lat * Math.PI / 180) / Math.pow(2, z);
  const same = Math.max(0.15, 4 * hit * mpp / 1000);
  const px = routePts.map(ll => map.project(ll, z)), found = [];
  for (let i = 1; i < px.length; i++) {
    const a = px[i - 1], b = px[i], dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
    const qx = a.x + t * dx, qy = a.y + t * dy, d = Math.hypot(p.x - qx, p.y - qy);
    if (d <= hit) found.push({ d, km: routeCum[i - 1] + t * (routeCum[i] - routeCum[i - 1]), ll: map.unproject(L.point(qx, qy), z) });
  }
  found.sort((x, y) => x.d - y.d);
  const out = [];
  for (const f of found) {
    if (!out.length || (f.d <= out[0].d + 10 && out.every(o => Math.abs(o.km - f.km) > same))) out.push(f);
    if (out.length >= 4) break;
  }
  return out.sort((x, y) => x.km - y.km);
}
const kmPopup = L.popup({ closeButton: false, autoPan: false, offset: [0, -2], className: 'kmpop' });
map.on('click', e => {
  if (routePts.length < 2) return;
  const r = routeKmAt(e.latlng);
  if (!r.length) return;
  const box = document.createElement('div');
  r.forEach(x => { const d = document.createElement('div'); d.textContent = fmtKm(x.km); box.appendChild(d); });
  kmPopup.setLatLng(r[0].ll).setContent(box).openOn(map);
});

// ---------- punkty POI ----------
const POI_SIZE = C.POI_ICON_SIZE_PX || 34;
const POI_TYPES = {
  zabka: '<circle cx="17" cy="17" r="16" fill="#1e9b4d" stroke="#fff" stroke-width="2"/>' +
         '<ellipse cx="17" cy="20" rx="9.5" ry="6.8" fill="#fff"/>' +
         '<circle cx="12.3" cy="12.6" r="4.3" fill="#fff"/><circle cx="21.7" cy="12.6" r="4.3" fill="#fff"/>' +

const smoothAngle = (prev, h, f) => prev == null ? h : prev + f * ((((h - prev) % 360) + 540) % 360 - 180);
let beamMarker = null, beamAngle = null, beamTimer = null, beamMode = null, lastMoveAt = 0;
let compassHeading = null, compassAt = 0, compassOn = false;
const holdMs = () => (C.HEADING_HOLD_SECONDS || 3) * 1000;
const isMoving = () => Date.now() - lastMoveAt < holdMs();
const compassFresh = () => compassHeading != null && Date.now() - compassAt < 2000;
function showBeam(angle, mode) {
  beamAngle = smoothAngle(beamAngle, angle, C.HEADING_SMOOTHING != null ? C.HEADING_SMOOTHING : 0.5);
  beamMarker.getElement().firstChild.style.transform = 'rotate(' + beamAngle.toFixed(1) + 'deg)';
  beamMarker.setOpacity(1); beamMode = mode;
}
function updateBeam(pos, ll) {
  if (C.SHOW_HEADING === false) return;
  if (!beamMarker) beamMarker = L.marker(ll, { icon: beamIcon(), pane: 'beamPane', interactive: false, keyboard: false, opacity: 0 }).addTo(map);
  beamMarker.setLatLng(ll);
  const hd = pos.coords.heading, sp = pos.coords.speed, minSp = C.HEADING_MIN_SPEED_MS != null ? C.HEADING_MIN_SPEED_MS : 1.5;
  if (hd == null || !isFinite(hd) || (sp != null && sp < minSp)) return;   // stoi albo brak kierunku z GPS: po chwili przejmuje kompas
  lastMoveAt = Date.now();
  showBeam(hd, 'move');
  clearTimeout(beamTimer);
  beamTimer = setTimeout(() => {
    if (compassFresh()) showBeam(compassHeading, 'compass');   // stoi: kierunek patrzenia z kompasu
    else { beamMarker.setOpacity(0); beamAngle = null; beamMode = null; }
  }, holdMs());
}

// ---------- kompas telefonu: kierunek patrzenia, gdy Uczestnik stoi ----------
// Kierunek, w którym skierowany jest telefon, z czujników orientacji (po zgodzie na iPhonie).
function headingFromOrientation(alpha, beta, gamma) {
  if (alpha == null) return null;
  const r = Math.PI / 180, x = (beta || 0) * r, y = (gamma || 0) * r, z = alpha * r;
  const cY = Math.cos(y), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);
  const vx = -cZ * sY - sZ * sX * cY, vy = -sZ * sY + cZ * sX * cY;
  if (Math.hypot(vx, vy) < 0.3) return (360 - alpha) % 360;   // telefon leży płasko: kierunek górnej krawędzi
  let hd = Math.atan(vx / vy);
  if (vy < 0) hd += Math.PI; else if (vx < 0) hd += 2 * Math.PI;
  return hd * 180 / Math.PI;
}
function onCompass(ev) {
  const now = Date.now();
  if (now - compassAt < 100) return;   // nie częściej niż 10 razy na sekundę
  const hd = typeof ev.webkitCompassHeading === 'number' ? ev.webkitCompassHeading : headingFromOrientation(ev.alpha, ev.beta, ev.gamma);
  if (hd == null || !isFinite(hd) || hd < 0) return;
  compassAt = now;
  compassHeading = (hd + (C.COMPASS_DECLINATION_DEG != null ? C.COMPASS_DECLINATION_DEG : 7) + 360) % 360;   // z północy magnetycznej na geograficzną
  if (beamMarker && C.SHOW_HEADING !== false && !isMoving()) showBeam(compassHeading, 'compass');
}
function startCompass() {
  if (compassOn || C.SHOW_COMPASS === false || typeof DeviceOrientationEvent === 'undefined') return;
  const attach = () => {
    compassOn = true;
    window.addEventListener('ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', onCompass, true);
  };
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {   // iPhone: zgoda wymaga dotknięcia przez użytkownika
    DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') attach(); }).catch(() => {});
  } else attach();                                                         // Android i komputery: bez pytania
}
function onFix(pos) {
  const ll = [pos.coords.latitude, pos.coords.longitude], acc = pos.coords.accuracy;
  if (!meMarker) {
    meCircle = L.circle(ll, { radius: acc, color: COL.me, weight: 1, fillOpacity: .12 }).addTo(map);
    meMarker = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: COL.me, fillOpacity: 1 }).addTo(map);
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll); meCircle.setRadius(acc); }
  updateBeam(pos, ll);
  setGeo(null);
}
function onGeoError(err) {
  setGeo(err.code === 1 ? 'GEO_DENIED' : 'GEO_UNAVAILABLE');
  if (err.code === 1) { navigator.geolocation.clearWatch(watchId); watchId = null; }
}

// ---------- przyciski i start ----------
$('btnIn').onclick = () => map.zoomIn();
$('btnOut').onclick = () => map.zoomOut();
$('btnFit').onclick = () => { if (routeBounds) map.fitBounds(routeBounds, { padding: [C.FIT_PADDING, C.FIT_PADDING] }); };
$('btnOrg').onclick = () => { if (orgMarker) focus(orgMarker.getLatLng()); };
$('btnMe').onclick = () => { startCompass(); if (meMarker) focus(meMarker.getLatLng()); else startLocating(); };

(async function start() {
  await setLang(pickLang(), false);   // najpierw teksty, potem reszta
  loadRoute(); pollLive(); startLocating();
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') startCompass();   // poza iPhonem bez pytania
  setInterval(pollLive, C.POLL_SECONDS * 1000);
  setInterval(() => {
    renderLive(); renderEta(); updateGlow();
    if (beamMode === 'compass' && !compassFresh() && beamMarker) { beamMarker.setOpacity(0); beamMode = null; beamAngle = null; }   // kompas przestał podawać dane
  }, 1000);   // odświeża "X sekund temu" i ETA między pobraniami
})();
</script>
